<!DOCTYPE html>
<html lang="en">
<!--
  LIBERTY CLASSIC TV – FINAL REBUILD WITH ALL AUDIT FIXES
  =========================================================
  - Responsive layout: no horizontal overflow, fluid flex
  - Touch targets: .guide-item min-height 54px, buttons >=44px
  - Font sizes: guide-title min 12px, guide-time min 10px
  - Expanded breakpoints: 768, 600, 480, 360, landscape
  - Removed inefficient interval watchdog → single timeupdate listener
  - Android Chrome fix: scroll video into view after loadedmetadata
  - Fixed snapper: interval 1000ms, snap to whole seconds
  - Disabled pingSyncTick (prevents UI flickering)
  - Preserved geolocation spoofing (required) and HLS recovery
  - Full playlist included (all episodes)
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liberty Classic TV – Responsive Player</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      background: #000;
      color: white;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      overflow: auto;
      height: 100%;
      width: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #top-banner {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      padding: 8px 15px;
      z-index: 1000;
      flex-shrink: 0;
    }
    .banner-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }
    .channel-info {
      flex: 1 1 200px;
      min-width: 0;
    }
    #top-banner h1 {
      margin: 0 0 4px 0;
      font-size: clamp(16px, 2.5vw, 22px);
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff;
      letter-spacing: 1px;
      font-weight: 900;
    }
    .info-line {
      font-size: clamp(13px, 1.8vw, 15px);
      line-height: 1.3;
      margin-bottom: 2px;
    }
    .now { color: #39ff14; font-weight: bold; }
    .next { color: #00f3ff; }
    .highlight { color: #ff0; font-weight: bold; }
    #clock {
      font-size: clamp(14px, 2vw, 18px);
      color: #00f3ff;
      font-weight: 900;
      text-shadow: 0 0 10px #00f3ff;
      white-space: nowrap;
      margin-top: 2px;
    }
    .guide-strip {
      flex: 2 1 300px;
      min-width: 0;
      max-height: 85px;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      gap: 10px;
      padding: 6px 0;
      scrollbar-width: thin;
    }
    .guide-item {
      flex: 0 0 auto;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 130px;
      max-width: 190px;
      min-height: 54px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .guide-item:hover {
      background: rgba(0, 243, 255, 0.2);
      transform: translateY(-1px);
    }
    .guide-item.current {
      background: rgba(57, 255, 20, 0.25);
      border-color: #39ff14;
      box-shadow: 0 0 6px #39ff14;
    }
    .guide-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      color: #fff;
    }
    .guide-time {
      font-size: 12px;
      color: #ccc;
      white-space: nowrap;
    }
    .guide-strip::-webkit-scrollbar { height: 6px; }
    .guide-strip::-webkit-scrollbar-track { background: rgba(0, 243, 255, 0.1); border-radius: 3px; }
    .guide-strip::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.5); border-radius: 3px; }
    #video-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #media-stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .aspect-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #media-stage video, #media-stage audio {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #000;
    }
    #control-bubble {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #00f3ff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      transition: all 0.3s;
      font-size: 22px;
      backdrop-filter: blur(4px);
    }
    #control-bubble:hover {
      background: rgba(0, 243, 255, 0.25);
      transform: scale(1.08);
    }
    #fullscreen-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 150;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #00f3ff;
      border-radius: 12px;
      color: #00f3ff;
      font-size: 26px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-shadow: 0 0 8px #00f3ff;
      min-width: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #fullscreen-btn:hover {
      background: rgba(0, 243, 255, 0.3);
      transform: scale(1.05);
    }
    #audio-visualizer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 1;
      pointer-events: none;
    }
    #audio-title-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      pointer-events: none;
      z-index: 5;
    }
    #audio-metadata {
      position: absolute;
      bottom: 60px;
      left: 30px;
      text-align: left;
      z-index: 10;
      max-width: calc(100% - 80px);
    }
    #audio-artist-name {
      font-size: clamp(20px, 5vw, 38px);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 12px rgba(255,255,255,0.9), 0 0 20px #00f3ff;
      text-transform: uppercase;
    }
    #audio-song-name {
      font-size: clamp(14px, 3vw, 26px);
      font-weight: 600;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.8);
    }
    #audio-timestamp {
      position: absolute;
      bottom: 60px;
      right: 30px;
      font-size: clamp(16px, 3vw, 22px);
      font-weight: 600;
      color: #fff;
      font-family: monospace;
    }
    #curtain-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #curtain-left, #curtain-right {
      position: absolute;
      height: 100%;
      width: 51%;
      background: linear-gradient(90deg,#1a0a20 0%,#0d0510 50%,#1a0a20 100%);
      transition: transform 0.8s cubic-bezier(0.68,-0.15,0.265,1.15);
      overflow: hidden;
    }
    #curtain-left { left: 0; transform: translateX(-101%); }
    #curtain-right { right: 0; transform: translateX(101%); }
    #curtain-left::before, #curtain-right::before {
      content: '';
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(90deg,transparent 0px,rgba(80,0,120,0.1) 2px,transparent 4px,rgba(0,0,0,0.2) 8px);
    }
    #curtain-left::after, #curtain-right::after {
      content: '';
      position: absolute;
      top: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg,#ffd700 0%,#b8860b 20%,#ffd700 40%,#b8860b 60%,#ffd700 80%,#b8860b 100%);
      box-shadow: 0 0 15px rgba(255,215,0,0.6);
    }
    #curtain-left::after { right: 0; }
    #curtain-right::after { left: 0; }
    #curtain-overlay.closed #curtain-left { transform: translateX(0); }
    #curtain-overlay.closed #curtain-right { transform: translateX(0); }
    #audio-banner {
      position: fixed;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      border: 1px solid rgba(255,0,255,0.5);
      border-radius: 16px 16px 0 0;
      padding: 12px 20px;
      z-index: 90;
      display: flex;
      gap: 18px;
      align-items: center;
      transition: bottom 0.3s ease-out;
      width: min(95vw, 600px);
      min-width: 0;
      backdrop-filter: blur(8px);
    }
    #audio-banner.visible { bottom: 0; }
    .freq-item { text-align: center; flex: 1; }
    .freq-label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
    .freq-value { font-size: 1rem; color: #0ff; font-weight: bold; }
    .freq-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .freq-bar-fill { height: 100%; background: linear-gradient(90deg,#0ff,#f0f); border-radius: 2px; transition: width 0.05s linear; }
    #now-playing-display {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #now-playing-display.visible { opacity: 1; }
    .np-header { font-size: 1.2rem; color: #ff3366; letter-spacing: 4px; margin-bottom: 15px; text-shadow: 0 0 20px #ff3366; }
    .np-artist { font-size: 2.5rem; color: #0ff; font-weight: bold; text-shadow: 0 0 30px #0ff; margin-bottom: 10px; }
    .np-title { font-size: 1.5rem; color: #f0f; text-shadow: 0 0 20px #f0f; }
    #sync-tick {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 9999;
      color: #39ff14;
      font: 700 11px monospace;
      opacity: 0;
      transition: opacity 0.15s linear;
      background: rgba(0,0,0,0.5);
      padding: 3px 6px;
      border-radius: 12px;
      pointer-events: none;
    }
    @media (max-width: 768px) {
      .banner-content { flex-direction: column; gap: 12px; }
      .guide-strip { max-height: 70px; }
      .guide-item { min-width: 120px; padding: 6px 10px; }
      .guide-title { font-size: 13px; }
      .guide-time { font-size: 11px; }
    }
    @media (max-width: 600px) {
      #top-banner { padding: 6px 12px; }
      .info-line { font-size: 12px; }
      .guide-title { font-size: 12px; }
      .guide-time { font-size: 10px; }
      #audio-banner { padding: 10px 12px; gap: 10px; }
      .freq-value { font-size: 0.9rem; }
    }
    @media (max-width: 480px) {
      .channel-info { flex: 1 1 100%; }
      .guide-strip { max-height: 65px; gap: 8px; }
      .guide-item { min-width: 110px; padding: 5px 8px; min-height: 48px; }
      .guide-title { font-size: 12px; }
      .guide-time { font-size: 10px; }
      #fullscreen-btn { padding: 6px 10px; font-size: 22px; min-width: 44px; min-height: 44px; }
      #control-bubble { width: 44px; height: 44px; font-size: 20px; bottom: 16px; right: 16px; }
      #audio-metadata { bottom: 40px; left: 15px; }
      #audio-timestamp { bottom: 40px; right: 15px; }
    }
    @media (max-width: 360px) {
      .guide-item { min-width: 100px; padding: 4px 6px; }
      .guide-title { font-size: 12px; }
      .guide-time { font-size: 10px; }
      .info-line { font-size: 11px; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #top-banner { padding: 4px 8px; }
      .guide-strip { max-height: 55px; }
      .guide-item { min-height: 44px; }
      #audio-metadata { bottom: 20px; left: 15px; }
      #audio-timestamp { bottom: 20px; right: 15px; }
      .np-artist { font-size: 1.8rem; }
      .np-title { font-size: 1.2rem; }
    }
    @media (max-height: 400px) {
      #top-banner { padding: 5px 10px; }
      #top-banner h1 { font-size: 14px; margin-bottom: 2px; }
      .info-line { font-size: 10px; }
      .guide-strip { max-height: 50px; }
    }
  </style>

  <!-- WorldViewTube Engine Recovery Script -->
  <script>
    (function() {
      function logEvent(msg) { console.log("[WVT-AutoFix]: " + msg); }
      var video = document.querySelector('video');
      if (!video) return;
      function fixFullscreen() {
        var fsBtn = document.querySelector('[data-fs-fix]') || document.getElementById('fullscreenBtn') || document.querySelector('[title="Fullscreen"]');
        if (fsBtn && !fsBtn.hasAttribute('data-fs-fixed')) {
          fsBtn.setAttribute('data-fs-fixed', 'true');
          fsBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
              var req = video.requestFullscreen || video.webkitEnterFullscreen || video.webkitRequestFullscreen;
              if (req) req.call(video).catch(err => logEvent('Fullscreen error: ' + err.message));
            } else {
              (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            }
          });
          logEvent('Fullscreen button patched');
        }
      }
      function syncVolume() {
        var muteBtn = document.querySelector('[data-mute-btn]') || document.getElementById('muteBtn');
        var volumeSlider = document.querySelector('[data-volume-slider]') || document.getElementById('volumeControl');
        if (!muteBtn) return;
        var isMuted = video.muted || video.volume === 0;
        muteBtn.innerHTML = isMuted ? '<i data-feather="volume-x"></i>' : '<i data-feather="volume-2"></i>';
        if (volumeSlider) { volumeSlider.value = isMuted ? 0 : video.volume; }
        if (window.feather) feather.replace();
      }
      video.addEventListener('volumechange', syncVolume);
      video.addEventListener('loadedmetadata', syncVolume);
      syncVolume();
      if (window.Hls && !window.Hls._recoveryPatched) {
        var OriginalHls = window.Hls;
        var PatchedHls = function(config) {
          var hls = new OriginalHls(config);
          hls.on(OriginalHls.Events.ERROR, function(event, data) {
            if (!data.fatal) return;
            logEvent('HLS fatal error: ' + data.type);
            if (data.type === OriginalHls.ErrorTypes.NETWORK_ERROR) {
              hls.startLoad();
            } else if (data.type === OriginalHls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            } else {
              logEvent('Unrecoverable HLS error');
            }
          });
          return hls;
        };
        PatchedHls._recoveryPatched = true;
        for (var key in OriginalHls) {
          if (OriginalHls.hasOwnProperty(key)) PatchedHls[key] = OriginalHls[key];
        }
        window.Hls = PatchedHls;
        logEvent('HLS error recovery injected');
      }
      if (!document.querySelector('.wvt-loading-overlay')) {
        var overlay = document.createElement('div');
        overlay.className = 'wvt-loading-overlay';
        overlay.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:9999; visibility:hidden; transition:visibility 0.2s;';

        overlay.appendChild(spinner);
        video.parentElement.style.position = 'relative';
        video.parentElement.appendChild(overlay);
        var style = document.createElement('style');
        style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
        document.head.appendChild(style);
        logEvent('Loading spinner injected');
      }
      fixFullscreen();
    })();

<noscript>⚠️ JavaScript is required for full functionality. Please enable JavaScript.</noscript>
<div id="top-banner">
  <div class="banner-content">
    <div class="channel-info">
      <h1>TV Player</h1>
      <div class="info-line now">NOW: <span id="now-playing">Loading...</span> <span style="color:#aaa;">(<span id="played-time">0:00:00</span>)</span></div>
      <div class="info-line next">UP NEXT: <span id="next-title">...</span> <span class="highlight">at <span id="next-time">??:??</span></span></div>
    </div>
    <div class="guide-strip" id="guide-strip"></div>
    <div id="clock">00:00</div>
  </div>
</div>
<div id="sync-tick">TICK</div>
<div id="video-container">
  <div id="media-stage">
    <div class="aspect-wrapper">
      <video autoplay controls id="video-player" playsinline preload="auto"></video>
      <audio controls id="audio-player" playsinline preload="auto" style="display:none;"></audio>
    </div>
    <canvas id="audio-visualizer"></canvas>
    <div id="audio-title-overlay">
      <div id="audio-metadata">
        <div id="audio-artist-name">ARTIST</div>
        <div id="audio-song-name">Song Title</div>
      </div>
      <div id="audio-timestamp">00:00</div>
    </div>
    <div id="curtain-overlay">

rY,0,centerX,centerY,orbRadius*1.8*orbPulse); orbGlow.addColorStop(0,'rgba(150,0,255,0.4)'); orbGlow.addColorStop(0.5,'rgba(100,0,200,0.2)'); orbGlow.addColorStop(1,'rgba(50,0,150,0)'); visCtx.fillStyle=orbGlow; visCtx.beginPath(); visCtx.arc(centerX,centerY,orbRadius*1.8*orbPulse,0,Math.PI*2); visCtx.fill(); visCtx.restore(); visCtx.save(); var orbGrad=visCtx.createRadialGradient(centerX-orbRadius*0.3,centerY-orbRadius*0.3,0,centerX,centerY,orbRadius*orbPulse); orbGrad.addColorStop(0,'rgba(200,100,255,0.9)'); orbGrad.addColorStop(0.4,'rgba(150,50,200,0.8)'); orbGrad.addColorStop(0.8,'rgba(100,0,150,0.7)'); orbGrad.addColorStop(1,'rgba(50,0,100,0.6)'); visCtx.shadowColor='rgba(150,0,255,0.8)'; visCtx.shadowBlur=30+beatIntensity*20; visCtx.fillStyle=orbGrad; visCtx.beginPath(); visCtx.arc(centerX,centerY,orbRadius*orbPulse,0,Math.PI*2); visCtx.fill(); visCtx.strokeStyle='rgba(200,150,255,0.6)'; visCtx.lineWidth=2; visCtx.stroke(); visCtx.restore(); visCtx.save(); visCtx.fillStyle='rgba(0,0,0,0.4)'; visCtx.font='bold '+(orbRadius*0.8)+'px Arial'; visCtx.textAlign='center'; visCtx.textBaseline='middle'; visCtx.fillText('\u266a',centerX,centerY); visCtx.restore(); var bassVal=Math.round(bassEnergy*255), midVal=Math.round(midEnergy*255), highVal=Math.round(highEnergy*255); var peakIdx=0, peakVal=0; if(dataArray){for(var j=0;j<binCount;j++){if(dataArray[j]>peakVal){peakVal=dataArray[j];peakIdx=j;}}} var peakFreq=Math.round(peakIdx*(audioContext?audioContext.sampleRate/2/binCount:22050/binCount)); updateAudioBannerFrequency(bassVal,midVal,highVal,peakFreq,peakVal); animationFrameId=requestAnimationFrame(drawVisualizer); }

  var h=Math.floor(seconds/3600).toString().padStart(2,'0');
  var m=Math.floor((seconds%3600)/60).toString().padStart(2,'0');
  var s=Math.floor(seconds%60).toString().padStart(2,'0');
  return h+':'+m+':'+s;
}
function updatePlayedTime() {
  var activeEl = getActiveMediaElement();

function calculateNextStart() {
  var activeEl = getActiveMediaElement();
  if(!activeEl || !activeEl.duration) return;
  var remaining=activeEl.duration-activeEl.currentTime;
  var nextStart=new Date(Date.now()+remaining*1000);
  document.getElementById('next-time').textContent=nextStart.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
function renderGuideStrip() {
  guideStrip.innerHTML='';
  playlist.forEach(function(item, index) {
    var guideItem=document.createElement('div');
    guideItem.className='guide-item'+(index===currentIndex?' current':'');
    guideItem.innerHTML='<div class="guide-title">'+item.title+'</div><div class="guide-time">#'+(index+1)+' \u2022 '+(item.group||'')+'</div>';
    guideItem.addEventListener('click', function(){ playMovie(index); });
    guideStrip.appendChild(guideItem);
  });
  var current=guideStrip.querySelector('.current');
  if(current) current.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function attachMediaEndListener(mediaElement, duration) {
  if (!mediaElement) return;
  var handler = function() {
    if (mediaElement.currentTime >= duration - 0.1) {
      mediaElement.removeEventListener('timeupdate', handler);
      playNext();
    }
  };
  mediaElement.addEventListener('timeupdate', handler);
}
// FIXED: Snapper interval increased to 1000ms and snap to whole seconds
function startAudioSnapper() {
  if (window.audioSnapperTimer) clearInterval(window.audioSnapperTimer);
  window.audioSnapperTimer = setInterval(function() {
    var activeEl = getActiveMediaElement();
    if (!activeEl || !isFinite(activeEl.currentTime)) return;
    var snapped = Math.round(activeEl.currentTime);
    if (Math.abs(activeEl.currentTime - snapped) > 0.5) {
      activeEl.currentTime = snapped;
    }
  }, 1000);
}

// Android Chrome fix: scroll container into view after metadata loads, only if not fully visible
function ensureMediaVisible() {
  var container = document.getElementById('video-container');
  if (!container) return;
  var rect = container.getBoundingClientRect();
  var fullyVisible = rect.top >= 0 && rect.bottom <= window.innerHeight;
  if (fullyVisible) return;
  requestAnimationFrame(function() {
    container.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
  });
}

function playMovie(index) {
  if(index<0||index>=playlist.length) index=0;
  currentIndex=index;
  var movie=playlist[index];
  var nextMovie=playlist[(index+1)%playlist.length];
  document.getElementById('now-playing').textContent=movie.title;
  document.getElementById('next-title').textContent=nextMovie?nextMovie.title:'...';
  var isAudio=isAudioFile(movie.url);
  if(isAudio) {
    switchToAudioMode(movie.title);
    audioEl.src=movie.url;
    audioEl.addEventListener('loadedmetadata', ensureMediaVisible, { once: true });
  } else {
    switchToVideoMode(); hideAudioPlayOverlay();
    video.src=movie.url;
    loadSubtitles(video, movie);
    video.addEventListener('loadedmetadata', ensureMediaVisible, { once: true });
  }
  var activeEl=isAudio?audioEl:video;
  if(isAudio && !userHasInteracted) { showAudioPlayOverlay(); }
  else {
    if(isAudio && audioContext && audioContext.state==='suspended') { audioContext.resume().then(function(){ ensurePlaybackReady(activeEl); }); }
    else { ensurePlaybackReady(activeEl); }
  }
  attachMediaEndListener(activeEl, movie.duration);
  renderGuideStrip(); calculateNextStart(); updatePlayedTime(); startAudioSnapper();
}

function initMidnightAnchor() {
  var now = new Date();
  var ptOffsetMs = 7 * 60 * 60 * 1000;
  var ptNow = new Date(now.getTime() - ptOffsetMs);
  var ptMidnight = Date.UTC(ptNow.getUTCFullYear(), ptNow.getUTCMonth(), ptNow.getUTCDate(), 0, 0, 0);
  var secondsPastMidnight = Math.floor((now.getTime() - ptOffsetMs - ptMidnight) / 1000);
  var totalDuration = 0;
  for (var p = 0; p < playlist.length; p++) { totalDuration += (playlist[p].duration || 300); }
  if (totalDuration <= 0) { playMovie(0); return; }
  var posInCycle = secondsPastMidnight % totalDuration;
  var acc = 0; var startIndex = 0; var seekOffset = 0;
  for (var i = 0; i < playlist.length; i++) {
    var itemDur = playlist[i].duration || 300;
    if (acc + itemDur > posInCycle) { startIndex = i; seekOffset = posInCycle - acc; break; }
    acc += itemDur;
  }
  playMovie(startIndex);
  var seekTarget = seekOffset;
  var activeEl = getActiveMediaElement();
  if (activeEl && seekTarget > 0) {
    var onMeta = function() {
      activeEl.removeEventListener('loadedmetadata', onMeta);
      if (seekTarget > 0 && isFinite(activeEl.duration)) { activeEl.currentTime = Math.min(seekTarget, activeEl.duration - 1); }
    };
    if (isFinite(activeEl.duration) && activeEl.duration > 0) { activeEl.currentTime = Math.min(seekTarget, activeEl.duration - 1); }
    else { activeEl.addEventListener('loadedmetadata', onMeta); }
  }
}
