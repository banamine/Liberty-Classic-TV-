<!DOCTYPE html>
<html lang="en">
<!--
  LIBERTY CLASSIC TV – FULLY RESPONSIVE & TOUCH-OPTIMIZED REBUILD
  Audit fixes applied:
  - Removed all hard min-width constraints that caused horizontal scroll
  - Increased touch targets (min 44x44) for guide items, buttons, etc.
  - Improved font sizes for mobile readability (guide-title: 14px, guide-time: 12px)
  - Expanded media queries: 768px, 600px, 480px, 360px, landscape orientation
  - Fixed #audio-banner min-width to fluid width
  - Preserved every original script (including geolocation layer) and all player features
  - No ellipses, no placeholders – full code
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liberty Classic TV – Responsive Player</title>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #000;
      color: white;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      overflow: auto;
      height: 100%;
      width: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ---------- TOP BANNER – FULLY FLUID ---------- */
    #top-banner {
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      padding: 8px 15px;
      z-index: 1000;
      flex-shrink: 0;
    }

    .banner-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      flex-wrap: wrap;
    }

    /* channel-info – no fixed min-width, uses flex shrink/grow */
    .channel-info {
      flex: 1 1 200px;
      min-width: 0;       /* allows shrinking below 300px */
    }

    #top-banner h1 {
      margin: 0 0 4px 0;
      font-size: clamp(16px, 2.5vw, 22px);
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff;
      letter-spacing: 1px;
      font-weight: 900;
    }

    .info-line {
      font-size: clamp(13px, 1.8vw, 15px);
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .now {
      color: #39ff14;
      font-weight: bold;
    }

    .next {
      color: #00f3ff;
    }

    .highlight {
      color: #ff0;
      font-weight: bold;
    }

    #clock {
      font-size: clamp(14px, 2vw, 18px);
      color: #00f3ff;
      font-weight: 900;
      text-shadow: 0 0 10px #00f3ff;
      white-space: nowrap;
      margin-top: 2px;
    }

    /* ---------- GUIDE STRIP – TOUCH FRIENDLY + NO HARD MIN-WIDTH ---------- */
    .guide-strip {
      flex: 2 1 300px;
      min-width: 0;           /* remove forced 400px */
      max-height: 85px;
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      gap: 10px;
      padding: 6px 0;
      scrollbar-width: thin;
    }

    /* guide-item: touch target >= 44px tall, readable text */
    .guide-item {
      flex: 0 0 auto;
      background: rgba(0, 243, 255, 0.1);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-width: 130px;
      max-width: 190px;
      min-height: 54px;       /* ensures comfortable tap area */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .guide-item:hover {
      background: rgba(0, 243, 255, 0.2);
      transform: translateY(-1px);
    }

    .guide-item.current {
      background: rgba(57, 255, 20, 0.25);
      border-color: #39ff14;
      box-shadow: 0 0 6px #39ff14;
    }

    /* increased font sizes for readability */
    .guide-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      color: #fff;
    }

    .guide-time {
      font-size: 12px;
      color: #ccc;
      white-space: nowrap;
    }

    /* scrollbar styling */
    .guide-strip::-webkit-scrollbar {
      height: 6px;
    }
    .guide-strip::-webkit-scrollbar-track {
      background: rgba(0, 243, 255, 0.1);
      border-radius: 3px;
    }
    .guide-strip::-webkit-scrollbar-thumb {
      background: rgba(0, 243, 255, 0.5);
      border-radius: 3px;
    }

    /* ---------- VIDEO/AUDIO CONTAINER ---------- */
    #video-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #media-stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .aspect-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #media-stage video,
    #media-stage audio {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #000;
    }

    /* control bubble (fullscreen toggle) – already 50x50, safe */
    #control-bubble {
      position: absolute;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #00f3ff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 50;
      transition: all 0.3s;
      font-size: 22px;
      backdrop-filter: blur(4px);
    }

    #control-bubble:hover {
      background: rgba(0, 243, 255, 0.25);
      transform: scale(1.08);
    }

    /* fullscreen button – large enough */
    #fullscreen-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 150;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #00f3ff;
      border-radius: 12px;
      color: #00f3ff;
      font-size: 26px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-shadow: 0 0 8px #00f3ff;
      min-width: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #fullscreen-btn:hover {
      background: rgba(0, 243, 255, 0.3);
      transform: scale(1.05);
    }

    /* ---------- AUDIO VISUALIZER & OVERLAYS ---------- */
    #audio-visualizer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 1;
      pointer-events: none;
    }

    #audio-title-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      pointer-events: none;
      z-index: 5;
    }

    #audio-metadata {
      position: absolute;
      bottom: 60px;
      left: 30px;
      text-align: left;
      z-index: 10;
      max-width: calc(100% - 80px);
    }

    #audio-artist-name {
      font-size: clamp(20px, 5vw, 38px);
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 12px rgba(255,255,255,0.9), 0 0 20px #00f3ff;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      word-wrap: break-word;
    }

    #audio-song-name {
      font-size: clamp(14px, 3vw, 26px);
      font-weight: 600;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.8);
      word-wrap: break-word;
    }

    #audio-timestamp {
      position: absolute;
      bottom: 60px;
      right: 30px;
      font-size: clamp(16px, 3vw, 22px);
      font-weight: 600;
      color: #fff;
      font-family: monospace;
    }

    /* curtain overlays (unchanged, but responsive) */
    #curtain-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #curtain-left, #curtain-right {
      position: absolute;
      height: 100%;
      width: 51%;
      background: linear-gradient(90deg,#1a0a20 0%,#0d0510 50%,#1a0a20 100%);
      transition: transform 0.8s cubic-bezier(0.68,-0.15,0.265,1.15);
      overflow: hidden;
    }

    #curtain-left { left: 0; transform: translateX(-101%); }
    #curtain-right { right: 0; transform: translateX(101%); }
    #curtain-left::before, #curtain-right::before {
      content: '';
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(90deg,transparent 0px,rgba(80,0,120,0.1) 2px,transparent 4px,rgba(0,0,0,0.2) 8px);
    }
    #curtain-left::after, #curtain-right::after {
      content: '';
      position: absolute;
      top: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg,#ffd700 0%,#b8860b 20%,#ffd700 40%,#b8860b 60%,#ffd700 80%,#b8860b 100%);
      box-shadow: 0 0 15px rgba(255,215,0,0.6);
    }
    #curtain-left::after { right: 0; }
    #curtain-right::after { left: 0; }
    #curtain-overlay.closed #curtain-left { transform: translateX(0); }
    #curtain-overlay.closed #curtain-right { transform: translateX(0); }

    /* audio banner – fluid width, no fixed min-width */
    #audio-banner {
      position: fixed;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      border: 1px solid rgba(255,0,255,0.5);
      border-radius: 16px 16px 0 0;
      padding: 12px 20px;
      z-index: 90;
      display: flex;
      gap: 18px;
      align-items: center;
      transition: bottom 0.3s ease-out;
      width: min(95vw, 600px);
      min-width: 0;
      backdrop-filter: blur(8px);
    }

    #audio-banner.visible { bottom: 0; }
    .freq-item { text-align: center; flex: 1; }
    .freq-label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
    .freq-value { font-size: 1rem; color: #0ff; font-weight: bold; }
    .freq-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .freq-bar-fill { height: 100%; background: linear-gradient(90deg,#0ff,#f0f); border-radius: 2px; transition: width 0.05s linear; }

    /* now playing display */
    #now-playing-display {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    #now-playing-display.visible { opacity: 1; }
    .np-header { font-size: 1.2rem; color: #ff3366; letter-spacing: 4px; margin-bottom: 15px; text-shadow: 0 0 20px #ff3366; }
    .np-artist { font-size: 2.5rem; color: #0ff; font-weight: bold; text-shadow: 0 0 30px #0ff; margin-bottom: 10px; }
    .np-title { font-size: 1.5rem; color: #f0f; text-shadow: 0 0 20px #f0f; }

    /* sync tick – small but functional */
    #sync-tick {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 9999;
      color: #39ff14;
      font: 700 11px monospace;
      opacity: 0;
      transition: opacity 0.15s linear;
      background: rgba(0,0,0,0.5);
      padding: 3px 6px;
      border-radius: 12px;
      pointer-events: none;
    }

    /* ---------- RESPONSIVE MEDIA QUERIES (EXPANDED) ---------- */
    /* Tablet and medium screens */
    @media (max-width: 768px) {
      .banner-content {
        flex-direction: column;
        gap: 12px;
      }
      .guide-strip {
        max-height: 70px;
      }
      .guide-item {
        min-width: 120px;
        padding: 6px 10px;
      }
      .guide-title { font-size: 13px; }
      .guide-time { font-size: 11px; }
    }

    /* Small landscape phones */
    @media (max-width: 600px) {
      #top-banner { padding: 6px 12px; }
      .info-line { font-size: 12px; }
      .guide-title { font-size: 12px; }
      .guide-time { font-size: 10px; }
      #audio-banner { padding: 10px 12px; gap: 10px; }
      .freq-value { font-size: 0.9rem; }
    }

    /* Narrow phones (iPhone SE, etc) */
    @media (max-width: 480px) {
      .channel-info { flex: 1 1 100%; }
      .guide-strip { max-height: 65px; gap: 8px; }
      .guide-item { min-width: 110px; padding: 5px 8px; min-height: 48px; }
      .guide-title { font-size: 11px; }
      .guide-time { font-size: 9px; }
      #fullscreen-btn { padding: 6px 10px; font-size: 22px; min-width: 44px; min-height: 44px; }
      #control-bubble { width: 44px; height: 44px; font-size: 20px; bottom: 16px; right: 16px; }
      #audio-metadata { bottom: 40px; left: 15px; }
      #audio-timestamp { bottom: 40px; right: 15px; }
    }

    /* very narrow devices (<=360px) */
    @media (max-width: 360px) {
      .guide-item { min-width: 100px; padding: 4px 6px; }
      .guide-title { font-size: 10px; }
      .guide-time { font-size: 8px; }
      .info-line { font-size: 11px; }
    }

    /* landscape orientation on phones */
    @media (orientation: landscape) and (max-height: 500px) {
      #top-banner { padding: 4px 8px; }
      .guide-strip { max-height: 55px; }
      .guide-item { min-height: 44px; }
      #audio-metadata { bottom: 20px; left: 15px; }
      #audio-timestamp { bottom: 20px; right: 15px; }
      .np-artist { font-size: 1.8rem; }
      .np-title { font-size: 1.2rem; }
    }

    /* short height adjustment */
    @media (max-height: 400px) {
      #top-banner { padding: 5px 10px; }
      #top-banner h1 { font-size: 14px; margin-bottom: 2px; }
      .info-line { font-size: 10px; }
      .guide-strip { max-height: 50px; }
    }
  </style>

  <!-- WorldViewTube Engine Recovery Script (preserved) -->
  <script>
    (function() {
      function logEvent(msg) { console.log("[WVT-AutoFix]: " + msg); }
      var video = document.querySelector('video');
      if (!video) return;
      function fixFullscreen() {
        var fsBtn = document.querySelector('[data-fs-fix]') || document.getElementById('fullscreenBtn') || document.querySelector('[title="Fullscreen"]');
        if (fsBtn && !fsBtn.hasAttribute('data-fs-fixed')) {
          fsBtn.setAttribute('data-fs-fixed', 'true');
          fsBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
              var req = video.requestFullscreen || video.webkitEnterFullscreen || video.webkitRequestFullscreen;
              if (req) req.call(video).catch(err => logEvent('Fullscreen error: ' + err.message));
            } else {
              (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            }
          });
          logEvent('Fullscreen button patched');
        }
      }
      function syncVolume() {
        var muteBtn = document.querySelector('[data-mute-btn]') || document.getElementById('muteBtn');
        var volumeSlider = document.querySelector('[data-volume-slider]') || document.getElementById('volumeControl');
        if (!muteBtn) return;
        var isMuted = video.muted || video.volume === 0;
        muteBtn.innerHTML = isMuted ? '<i data-feather="volume-x"></i>' : '<i data-feather="volume-2"></i>';
        if (volumeSlider) { volumeSlider.value = isMuted ? 0 : video.volume; }
        if (window.feather) feather.replace();
      }
      video.addEventListener('volumechange', syncVolume);
      video.addEventListener('loadedmetadata', syncVolume);
      syncVolume();
      if (window.Hls && !window.Hls._recoveryPatched) {
        var OriginalHls = window.Hls;
        var PatchedHls = function(config) {
          var hls = new OriginalHls(config);
          hls.on(OriginalHls.Events.ERROR, function(event, data) {
            if (!data.fatal) return;
            logEvent('HLS fatal error: ' + data.type);
            if (data.type === OriginalHls.ErrorTypes.NETWORK_ERROR) {
              hls.startLoad();
            } else if (data.type === OriginalHls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            } else {
              logEvent('Unrecoverable HLS error');
            }
          });
          return hls;
        };
        PatchedHls._recoveryPatched = true;
        for (var key in OriginalHls) {
          if (OriginalHls.hasOwnProperty(key)) PatchedHls[key] = OriginalHls[key];
        }
        window.Hls = PatchedHls;
        logEvent('HLS error recovery injected');
      }
      if (!document.querySelector('.wvt-loading-overlay')) {
        var overlay = document.createElement('div');
        overlay.className = 'wvt-loading-overlay';
        overlay.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:9999; visibility:hidden; transition:visibility 0.2s;';
        var spinner = document.createElement('div');
        spinner.style.cssText = 'width:48px; height:48px; border:4px solid rgba(212,175,55,0.3); border-top-color:#d4af37; border-radius:50%; animation: spin 0.8s linear infinite;';
        overlay.appendChild(spinner);
        video.parentElement.style.position = 'relative';
        video.parentElement.appendChild(overlay);
        var style = document.createElement('style');
        style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
        document.head.appendChild(style);
        logEvent('Loading spinner injected');
      }
      fixFullscreen();
    })();
  </script>

<div id="top-banner">

      <div class="freq-item"><div class="freq-label">Mid</div><div class="freq-value" id="ab-mid">0</div><div class="freq-bar"><div class="freq-bar-fill" id="ab-mid-bar"></div></div></div>
      <div class="freq-item"><div class="freq-label">High</div><div class="freq-value" id="ab-high">0</div><div class="freq-bar"><div class="freq-bar-fill" id="ab-high-bar"></div></div></div>
      <div class="freq-item"><div class="freq-label">Peak</div><div class="freq-value" id="ab-peak">0 Hz</div><div class="freq-bar"><div class="freq-bar-fill" id="ab-peak-bar"></div></div></div>

<script>
// ==================== AUDIO VISUALIZER (FULL PRESERVED) ====================
var audioContext = null, analyser = null, dataArray = null, animationFrameId = null;
var isAudioMode = false, audioSourceConnected = false, rotationAngle = 0;
var visCanvas = null, visCtx = null, audioTitleOverlay = null;
var audioArtistName = null, audioSongName = null, audioTimestamp = null;
var visVideo = null, visAudio = null, currentAudioSource = null, currentAudioElement = null, domResolved = false;
var syncTick = null, syncTickTimer = null;
function resolveVisualizerDom() {
  if (domResolved) return;
  visCanvas = document.getElementById('audio-visualizer');
  visCtx = visCanvas ? visCanvas.getContext('2d') : null;
  audioTitleOverlay = document.getElementById('audio-title-overlay');
  audioArtistName = document.getElementById('audio-artist-name');
  audioSongName = document.getElementById('audio-song-name');
  audioTimestamp = document.getElementById('audio-timestamp');
  visVideo = document.getElementById('video-player');
  visAudio = document.getElementById('audio-player');
  syncTick = document.getElementById('sync-tick');
  domResolved = true;
}
if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', resolveVisualizerDom); } else { resolveVisualizerDom(); }
function getActiveMediaElement() { return isAudioMode ? visAudio : visVideo; }
var AUDIO_EXTENSIONS = ['.mp3','.wav','.flac','.aac','.ogg','.m4a','.wma','.opus'];
function isAudioFile(url) {
  if (!url) return false;
  var pathname = url.split('?')[0].toLowerCase();
  return AUDIO_EXTENSIONS.some(function(ext){ return pathname.endsWith(ext); });
}
function parseArtistAndSong(title) {
  if (!title) return { artist:'Unknown Artist', song:'Unknown Track' };
  var separators = [' - ',' \u2013 ',' \u2014 ',' _ ','|',':'];
  for (var i = 0; i < separators.length; i++) {
    var sep = separators[i];
    if (title.indexOf(sep) !== -1) {
      var parts = title.split(sep);
      if (parts.length >= 2) return { artist: parts[0].trim().toUpperCase(), song: parts.slice(1).join(sep).trim() };
    }
  }
  return { artist:'NOW PLAYING', song:title };
}
function formatAudioTime(seconds) {
  if (isNaN(seconds)) return '00:00';
  var m = Math.floor(seconds/60).toString().padStart(2,'0');
  var s = Math.floor(seconds%60).toString().padStart(2,'0');
  return m + ':' + s;
}
var userHasInteracted = false;
var audioBannerTimer = null;
var AUDIO_BANNER_HIDE_DELAY = 3000;
var consecutiveErrorCount = 0;
var MAX_CONSECUTIVE_ERRORS = 5;
var ERROR_DELAY_MS = 2000;
var errorOverlayVisible = false;
function showErrorOverlay(message) {
  if (errorOverlayVisible) return;
  errorOverlayVisible = true;
  var overlay = document.getElementById('playback-error-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'playback-error-overlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;color:#fff;font-family:sans-serif;';
    overlay.innerHTML = '<div style="text-align:center;max-width:80%;"><div style="font-size:48px;margin-bottom:20px;">&#9888;</div><div id="error-message" style="font-size:18px;margin-bottom:30px;color:#ff6b6b;"></div><div style="display:flex;gap:20px;justify-content:center;"><button id="error-skip-btn" style="padding:15px 30px;background:linear-gradient(135deg,#00f3ff,#39ff14);color:#000;font-size:16px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;">Skip to Next</button><button id="error-retry-btn" style="padding:15px 30px;background:#333;color:#fff;font-size:16px;font-weight:bold;border:1px solid #555;border-radius:8px;cursor:pointer;">Retry Current</button></div></div>';
    document.body.appendChild(overlay);
    document.getElementById('error-skip-btn').addEventListener('click', function(){ hideErrorOverlay(); consecutiveErrorCount=0; playMovie((currentIndex+1)%playlist.length); });
    document.getElementById('error-retry-btn').addEventListener('click', function(){ hideErrorOverlay(); consecutiveErrorCount=0; playMovie(currentIndex); });
  }
  document.getElementById('error-message').textContent = message || 'Multiple playback failures detected.';
  overlay.style.display = 'flex';
}
function hideErrorOverlay() {
  var overlay = document.getElementById('playback-error-overlay');
  if (overlay) overlay.style.display = 'none';
  errorOverlayVisible = false;
}
function handleMediaError(errorEvent) {
  consecutiveErrorCount++;
  if (consecutiveErrorCount >= MAX_CONSECUTIVE_ERRORS) { showErrorOverlay('Stopped after ' + MAX_CONSECUTIVE_ERRORS + ' consecutive playback failures.'); return; }
  setTimeout(function(){ playMovie((currentIndex+1)%playlist.length); }, ERROR_DELAY_MS);
}
function resetErrorCount() { consecutiveErrorCount = 0; hideErrorOverlay(); }
function initAudioContext(mediaElement) {
  if (!mediaElement || !isAudioMode) return;
  if (currentAudioElement === mediaElement && audioSourceConnected) return;
  try {
    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
    if (currentAudioSource && currentAudioElement !== mediaElement) { try { currentAudioSource.disconnect(); } catch(e){} }
    if (!analyser) { analyser = audioContext.createAnalyser(); analyser.fftSize=256; analyser.smoothingTimeConstant=0.8; }
    currentAudioSource = audioContext.createMediaElementSource(mediaElement);
    currentAudioSource.connect(analyser);
    analyser.connect(audioContext.destination);
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    currentAudioElement = mediaElement;
    audioSourceConnected = true;
  } catch(e) { console.error('Audio context init failed:', e); }
}
function ensurePlaybackReady(mediaElement) {
  if (!mediaElement) return;
  if (mediaElement.readyState >= 3) { mediaElement.play().catch(function(e){ console.error('Play failed:',e); }); return; }
  var handleCanPlay = function(){ mediaElement.removeEventListener('canplay',handleCanPlay); mediaElement.play().catch(function(e){ console.error('Play failed:',e); }); };
  mediaElement.addEventListener('canplay', handleCanPlay, { once:true, passive:true });
}
function resumeAudioAndPlay() {
  var activeEl = getActiveMediaElement();
  if (audioContext && audioContext.state === 'suspended') { audioContext.resume().then(function(){ ensurePlaybackReady(activeEl); }); }
  else { ensurePlaybackReady(activeEl); }
}
function showAudioPlayOverlay() {
  var overlay = document.getElementById('audio-play-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'audio-play-overlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:pointer;';
    overlay.innerHTML = '<div style="padding:20px 40px;background:linear-gradient(135deg,#00f3ff,#39ff14);color:#000;font-size:24px;font-weight:bold;border-radius:10px;box-shadow:0 0 30px rgba(0,243,255,0.5);">&#9654; Click to Play Audio</div>';
    overlay.addEventListener('click', function(){ userHasInteracted=true; overlay.style.display='none'; resumeAudioAndPlay(); });
    document.body.appendChild(overlay);
  }
  overlay.style.display = 'flex';
}
function hideAudioPlayOverlay() { var o = document.getElementById('audio-play-overlay'); if(o) o.style.display='none'; }
function initAudioBanner() {
  document.addEventListener('mousemove', function(){ if(isAudioMode) showAudioBanner(); }, { passive:true });
  document.addEventListener('touchstart', function(){ if(isAudioMode) showAudioBanner(); }, { passive:true });
  var ab = document.getElementById('audio-banner');
  if (!ab) return;
  ab.addEventListener('mouseenter', function(){ if(isAudioMode){ clearTimeout(audioBannerTimer); ab.classList.add('visible'); } });
  ab.addEventListener('mouseleave', function(){ if(isAudioMode) audioBannerTimer=setTimeout(hideAudioBanner, AUDIO_BANNER_HIDE_DELAY); });
}
function showAudioBanner() { var ab=document.getElementById('audio-banner'); if(!ab) return; ab.classList.add('visible'); clearTimeout(audioBannerTimer); audioBannerTimer=setTimeout(hideAudioBanner,AUDIO_BANNER_HIDE_DELAY); }
function hideAudioBanner() { var ab=document.getElementById('audio-banner'); if(ab) ab.classList.remove('visible'); }
function showNowPlayingDisplay(artist, title) {
  var npA=document.getElementById('np-artist'), npT=document.getElementById('np-title'), npD=document.getElementById('now-playing-display');
  if(npA) npA.textContent=artist||'Unknown Artist';
  if(npT) npT.textContent=title||'Unknown Track';
  if(npD) npD.classList.add('visible');
}
function hideNowPlayingDisplay() { var npD=document.getElementById('now-playing-display'); if(npD) npD.classList.remove('visible'); }
function updateAudioBannerFrequency(bass, mid, high, peak, peakValue) {
  var e = function(id){ return document.getElementById(id); };
  if(e('ab-bass')) e('ab-bass').textContent=bass; if(e('ab-mid')) e('ab-mid').textContent=mid;
  if(e('ab-high')) e('ab-high').textContent=high; if(e('ab-peak')) e('ab-peak').textContent=peak+' Hz';
  if(e('ab-bass-bar')) e('ab-bass-bar').style.width=(bass/255*100)+'%'; if(e('ab-mid-bar')) e('ab-mid-bar').style.width=(mid/255*100)+'%';
  if(e('ab-high-bar')) e('ab-high-bar').style.width=(high/255*100)+'%'; if(e('ab-peak-bar')) e('ab-peak-bar').style.width=(peakValue/255*100)+'%';
}
document.addEventListener('click', function(){ userHasInteracted=true; hideAudioPlayOverlay(); }, { once:true, passive:true });
function drawVisualizer() {
  if (!domResolved) resolveVisualizerDom();
  if (!visCtx || !visCanvas) return;
  var width = visCanvas.width, height = visCanvas.height;
  if (width <= 0 || height <= 0) { visCanvas.width=window.innerWidth||1280; visCanvas.height=window.innerHeight||720; animationFrameId=requestAnimationFrame(drawVisualizer); return; }
  var centerX=width/2, centerY=height*0.42;
  var bassEnergy=0, midEnergy=0, highEnergy=0, binCount=128;
  if (analyser && dataArray) {
    analyser.getByteFrequencyData(dataArray); binCount=dataArray.length;
    for (var i=0; i<binCount; i++) {
      if (i<binCount*0.15) bassEnergy+=dataArray[i];
      else if (i<binCount*0.5) midEnergy+=dataArray[i];
      else highEnergy+=dataArray[i];
    }
    bassEnergy=bassEnergy/(binCount*0.15)/255; midEnergy=midEnergy/(binCount*0.35)/255; highEnergy=highEnergy/(binCount*0.5)/255;
  }
  var beatIntensity=Math.min((bassEnergy*0.6+midEnergy*0.3+highEnergy*0.1)*1.5,1);
  var bgGrad=visCtx.createRadialGradient(centerX,height,0,centerX,height,height*1.2);
  bgGrad.addColorStop(0,'#0d0015'); bgGrad.addColorStop(0.5,'#0a0020'); bgGrad.addColorStop(1,'#050010');
  visCtx.fillStyle=bgGrad; visCtx.fillRect(0,0,width,height);
  rotationAngle+=0.003;
  var baseRadiusX=Math.min(width,height)*0.28, baseRadiusY=baseRadiusX*0.25, ringY=height*0.68;
  for (var ring=6; ring>=0; ring--) {
    var ringScale=1+ring*0.18, pulseScale=1+beatIntensity*0.15*(1-ring*0.08);
    var radiusX=baseRadiusX*ringScale*pulseScale, radiusY=baseRadiusY*ringScale*pulseScale;
    var hue=180+ring*25, alpha=0.7-ring*0.08, glowIntensity=15+beatIntensity*25;
    visCtx.save(); visCtx.translate(centerX,ringY); visCtx.rotate(rotationAngle*(ring%2===0?1:-1)*0.3);
    visCtx.shadowColor='hsl('+hue+',100%,60%)'; visCtx.shadowBlur=glowIntensity;
    visCtx.strokeStyle='hsla('+hue+',100%,60%,'+alpha+')'; visCtx.lineWidth=2+beatIntensity*2;
    visCtx.beginPath(); visCtx.ellipse(0,0,radiusX,radiusY,0,0,Math.PI*2); visCtx.stroke(); visCtx.restore();
  }
  var orbRadius=Math.min(width,height)*0.14, orbPulse=1+beatIntensity*0.08;
  visCtx.save();
  var orbGlow=visCtx.createRadialGradient(centerX,centerY,0,centerX,centerY,orbRadius*1.8*orbPulse);
  orbGlow.addColorStop(0,'rgba(150,0,255,0.4)'); orbGlow.addColorStop(0.5,'rgba(100,0,200,0.2)'); orbGlow.addColorStop(1,'rgba(50,0,150,0)');
  visCtx.fillStyle=orbGlow; visCtx.beginPath(); visCtx.arc(centerX,centerY,orbRadius*1.8*orbPulse,0,Math.PI*2); visCtx.fill(); visCtx.restore();
  visCtx.save();
  var orbGrad=visCtx.createRadialGradient(centerX-orbRadius*0.3,centerY-orbRadius*0.3,0,centerX,centerY,orbRadius*orbPulse);
  orbGrad.addColorStop(0,'rgba(200,100,255,0.9)'); orbGrad.addColorStop(0.4,'rgba(150,50,200,0.8)'); orbGrad.addColorStop(0.8,'rgba(100,0,150,0.7)'); orbGrad.addColorStop(1,'rgba(50,0,100,0.6)');
  visCtx.shadowColor='rgba(150,0,255,0.8)'; visCtx.shadowBlur=30+beatIntensity*20;
  visCtx.fillStyle=orbGrad; visCtx.beginPath(); visCtx.arc(centerX,centerY,orbRadius*orbPulse,0,Math.PI*2); visCtx.fill();
  visCtx.strokeStyle='rgba(200,150,255,0.6)'; visCtx.lineWidth=2; visCtx.stroke(); visCtx.restore();
  visCtx.save(); visCtx.fillStyle='rgba(0,0,0,0.4)'; visCtx.font='bold '+(orbRadius*0.8)+'px Arial';
  visCtx.textAlign='center'; visCtx.textBaseline='middle'; visCtx.fillText('\u266a',centerX,centerY); visCtx.restore();
  var bassVal=Math.round(bassEnergy*255), midVal=Math.round(midEnergy*255), highVal=Math.round(highEnergy*255);
  var peakIdx=0, peakVal=0;
  if (dataArray) { for(var j=0;j<binCount;j++){if(dataArray[j]>peakVal){peakVal=dataArray[j];peakIdx=j;}}}
  var peakFreq=Math.round(peakIdx*(audioContext?audioContext.sampleRate/2/binCount:22050/binCount));
  updateAudioBannerFrequency(bassVal,midVal,highVal,peakFreq,peakVal);
  animationFrameId=requestAnimationFrame(drawVisualizer);
}
function updateAudioMetadata(title) {
  var ps=parseArtistAndSong(title);
  if(audioArtistName) audioArtistName.textContent=ps.artist;
  if(audioSongName) audioSongName.textContent=ps.song;
}
function updateAudioTimestamp() {
  if(audioTimestamp && isAudioMode) { var ae=getActiveMediaElement(); audioTimestamp.textContent=formatAudioTime(ae.currentTime); }
}
function switchToAudioMode(title) {
  if(!domResolved) resolveVisualizerDom();
  isAudioMode=true;
  if(visVideo){ visVideo.pause(); visVideo.style.display='none'; visVideo.style.visibility='hidden'; visVideo.style.zIndex='1'; }
  if(visAudio){ visAudio.style.display='block'; visAudio.style.visibility='visible'; visAudio.style.zIndex='5'; }
  if(visCanvas){ visCanvas.style.display='block'; visCanvas.style.zIndex='10'; visCanvas.width=visCanvas.offsetWidth||window.innerWidth||1280; visCanvas.height=visCanvas.offsetHeight||window.innerHeight||720; }
  if(audioTitleOverlay) audioTitleOverlay.style.display='block';
  initAudioContext(visAudio);
  if(audioContext && audioContext.state==='suspended') audioContext.resume();
  if(!animationFrameId) drawVisualizer();
  updateAudioMetadata(title);
  var ps=parseArtistAndSong(title); showNowPlayingDisplay(ps.artist,ps.song);
  showAudioBanner();
}
function switchToVideoMode() {
  if(!domResolved) resolveVisualizerDom();
  isAudioMode=false;
  if(visAudio){ visAudio.pause(); visAudio.style.display='none'; visAudio.style.visibility='hidden'; visAudio.style.zIndex='1'; }
  if(visVideo){ visVideo.style.display='block'; visVideo.style.visibility='visible'; visVideo.style.zIndex='5'; }
  if(visCanvas){ visCanvas.style.display='none'; visCanvas.style.zIndex='1'; }
  if(audioTitleOverlay) audioTitleOverlay.style.display='none';
  hideNowPlayingDisplay(); hideAudioBanner();
  if(animationFrameId){ cancelAnimationFrame(animationFrameId); animationFrameId=null; }
}
function attachTimeupdateListeners() {
  if(visVideo) visVideo.addEventListener('timeupdate', updateAudioTimestamp);
  if(visAudio) visAudio.addEventListener('timeupdate', updateAudioTimestamp);
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', attachTimeupdateListeners); } else { attachTimeupdateListeners(); }
// ==================== CURTAIN TRANSITIONS ====================
var CURTAIN_ANIMATION_TIME = 800;
var curtainOverlay = null, isCurtainTransitioning = false;
function resolveCurtainDom() { if(!curtainOverlay) curtainOverlay=document.getElementById('curtain-overlay'); }
function closeCurtain(onComplete) {
  resolveCurtainDom();
  if(!curtainOverlay||isCurtainTransitioning){ if(onComplete) onComplete(); return; }
  isCurtainTransitioning=true; curtainOverlay.classList.add('closed');
  setTimeout(function(){ isCurtainTransitioning=false; if(onComplete) onComplete(); }, CURTAIN_ANIMATION_TIME);
}
function openCurtain(onComplete) {
  resolveCurtainDom();
  if(!curtainOverlay||isCurtainTransitioning){ if(onComplete) onComplete(); return; }
  isCurtainTransitioning=true; curtainOverlay.classList.remove('closed');
  setTimeout(function(){ isCurtainTransitioning=false; if(onComplete) onComplete(); }, CURTAIN_ANIMATION_TIME);
}
function playCurtainTransition(onMidpoint, onComplete) {
  closeCurtain(function(){ if(onMidpoint) onMidpoint(); setTimeout(function(){ openCurtain(onComplete); }, 200); });
}

:"General","duration":3590,"tvg-logo":""},{"title":"2026-Jun-05, Friday · Alex Jones Show · Hour 1","url":"https://ajn.archives.pub/hourly-m4v/20260605_Fri_Alex-Hr1.m4v","episode":"2026-Jun-05, Friday · Alex Jones Show · Hour 1","group":"General","duration":3590,"tvg-logo":""},{"title":"2026-Jun-05, Friday · Alex Jones Show · Hour 2","url":"https://ajn.archives.pub/hourly-m4v/20260605_Fri_Alex-Hr2.m4v","episode":"2026-Jun-05, Friday · Alex Jones Show · Hour 2","group":"General","duration":3590,"tvg-logo":""},{"title":"2026-Jun-05, Friday · Alex Jones Show · Hour 3","url":"https://ajn.archives.pub/hourly-m4v/20260605_Fri_Alex-Hr3.m4v","episode":"2026-Jun-05, Friday · Alex Jones Show · Hour 3","group":"General","duration":3590,"tvg-logo":""},{"title":"2026-Jun-05, Friday · Alex Jones Show · Hour 4","url":"https://ajn.archives.pub/hourly-m4v/20260605_Fri_Alex-Hr4.m4v","episode":"2026-Jun-05, Friday · Alex Jones Show · Hour 4","group":"General","duration":3590,"tvg-logo":""},{"title":"2026-Jun-05, Friday · War Room · Hour 1","url":"https://ajn.archives.pub/hourly-m4v/20260605_Fri_WarRoom-Hr1.m4v","episode":"2026-Jun-05, Friday · War Room · Hour 1","group":"General","duration":3590,"tvg-logo":""},{"title":"2026-Jun-05, Friday · War Room · Hour 2","url":"https://ajn.archives.pub/hourly-m4v/20260605_Fri_WarRoom-Hr2.m4v","episode":"2026-Jun-05, Friday · War Room · Hour 2","group":"General","duration":3590,"tvg-logo":""},{"title":"2026-Jun-05, Friday · War Room · Hour 3","url":"https://ajn.archives.pub/hourly-m4v/20260605_Fri_WarRoom-Hr3.m4v","episode":"2026-Jun-05, Friday · War Room · Hour 3","group":"General","duration":3590,"tvg-logo":""}];
var segmentWatchdogTimer = null;
var audioSnapperTimer = null;
var currentIndex = 0;
var video = document.getElementById('video-player');
var audioEl = document.getElementById('audio-player');
var guideStrip = document.getElementById('guide-strip');

function formatTime(seconds) {
  var h=Math.floor(seconds/3600).toString().padStart(2,'0');
  var m=Math.floor((seconds%3600)/60).toString().padStart(2,'0');
  var s=Math.floor(seconds%60).toString().padStart(2,'0');
  return h+':'+m+':'+s;
}
function updatePlayedTime() {
  var activeEl = getActiveMediaElement();
  if(activeEl && activeEl.currentTime) document.getElementById('played-time').textContent=formatTime(activeEl.currentTime);
}
function updateClock() {
  document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function calculateNextStart() {
  var activeEl = getActiveMediaElement();
  if(!activeEl || !activeEl.duration) return;
  var remaining=activeEl.duration-activeEl.currentTime;
  var nextStart=new Date(Date.now()+remaining*1000);
  document.getElementById('next-time').textContent=nextStart.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
function renderGuideStrip() {
  guideStrip.innerHTML='';
  playlist.forEach(function(item, index) {
    var guideItem=document.createElement('div');
    guideItem.className='guide-item'+(index===currentIndex?' current':'');
    guideItem.innerHTML='<div class="guide-title">'+item.title+'</div><div class="guide-time">#'+(index+1)+' \u2022 '+(item.group||'')+'</div>';
    guideItem.addEventListener('click', function(){ playMovie(index); });
    guideStrip.appendChild(guideItem);
  });
  var current=guideStrip.querySelector('.current');
  if(current) current.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function startSegmentWatchdog() {
  if (segmentWatchdogTimer) clearInterval(segmentWatchdogTimer);
  segmentWatchdogTimer = setInterval(function() {
    var item = playlist[currentIndex];
    var player = getActiveMediaElement();
    if (!player || !item) return;
    player.ontimeupdate = function() {
      if (player.currentTime >= item.duration) playNext();
    };
  }, 500);
}
function startAudioSnapper() {
  if (audioSnapperTimer) clearInterval(audioSnapperTimer);
  audioSnapperTimer = setInterval(function() {
    var activeEl = getActiveMediaElement();
    if (!activeEl || !isFinite(activeEl.currentTime)) return;
    var snapped = Math.round(activeEl.currentTime * 10) / 10;
    if (Math.abs(activeEl.currentTime - snapped) > 0.01) {
      activeEl.currentTime = snapped;
    }
  }, 100);
}
function playNext() {
  playMovie(currentIndex + 1);
}
function playMovie(index) {
  if(index<0||index>=playlist.length) index=0;
  currentIndex=index;
  var movie=playlist[index];
  var nextMovie=playlist[(index+1)%playlist.length];
  document.getElementById('now-playing').textContent=movie.title;
  document.getElementById('now-playing').innerText=movie.title;
  document.getElementById('next-title').textContent=nextMovie?nextMovie.title:'...';
  var isAudio=isAudioFile(movie.url);
  if(isAudio) {
    switchToAudioMode(movie.title);
    audioEl.src=movie.url;
  } else {
    switchToVideoMode(); hideAudioPlayOverlay();
    video.src=movie.url;
    loadSubtitles(video, movie);
  }
  var activeEl=isAudio?audioEl:video;
  if(isAudio && !userHasInteracted) { showAudioPlayOverlay(); }
  else {
    if(isAudio && audioContext && audioContext.state==='suspended') { audioContext.resume().then(function(){ ensurePlaybackReady(activeEl); }); }
    else { ensurePlaybackReady(activeEl); }
  }
  renderGuideStrip(); calculateNextStart(); updatePlayedTime(); startSegmentWatchdog(); startAudioSnapper();
}
video.addEventListener('ended', function(){ resetErrorCount(); playMovie((currentIndex+1)%playlist.length); });
video.addEventListener('error', function(e){ handleMediaError(e); });
video.addEventListener('canplay', function(){ resetErrorCount(); });
video.addEventListener('timeupdate', function(){ updatePlayedTime(); calculateNextStart(); });
audioEl.addEventListener('ended', function(){ resetErrorCount(); playMovie((currentIndex+1)%playlist.length); });
audioEl.addEventListener('error', function(e){ handleMediaError(e); });
audioEl.addEventListener('canplay', function(){ resetErrorCount(); });
audioEl.addEventListener('timeupdate', function(){ updatePlayedTime(); calculateNextStart(); });
function toggleFullscreen() {
  if(!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
    var el=document.body;
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if(el.mozRequestFullScreen) el.mozRequestFullScreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    else if(document.mozCancelFullScreen) document.mozCancelFullScreen();
  }
}
document.getElementById('control-bubble').addEventListener('click', toggleFullscreen);
var fsBtn2=document.getElementById('fullscreen-btn');
if(fsBtn2) fsBtn2.addEventListener('click', toggleFullscreen);
document.addEventListener('keydown', function(e) {
  if(e.key==='ArrowRight') playMovie((currentIndex+1)%playlist.length);
  if(e.key==='ArrowLeft') playMovie((currentIndex-1+playlist.length)%playlist.length);
  var activeEl=getActiveMediaElement();
  if(e.key===' '){ e.preventDefault(); activeEl.paused?activeEl.play():activeEl.pause(); }
  if(e.key==='f'||e.key==='F') toggleFullscreen();
});
window.addEventListener('online', function(){ setTimeout(function(){ playMovie(currentIndex); }, 1000); });
initAudioBanner();

function initMidnightAnchor() {
  var now = new Date();
  var ptOffsetMs = 7 * 60 * 60 * 1000;
  var ptNow = new Date(now.getTime() - ptOffsetMs);
  var ptMidnight = Date.UTC(ptNow.getUTCFullYear(), ptNow.getUTCMonth(), ptNow.getUTCDate(), 0, 0, 0);
  var secondsPastMidnight = Math.floor((now.getTime() - ptOffsetMs - ptMidnight) / 1000);
  var totalDuration = 0;
  for (var p = 0; p < playlist.length; p++) { totalDuration += (playlist[p].duration || 300); }
  if (totalDuration <= 0) { playMovie(0); return; }
  var posInCycle = secondsPastMidnight % totalDuration;
  var acc = 0; var startIndex = 0; var seekOffset = 0;
  for (var i = 0; i < playlist.length; i++) {
    var itemDur = playlist[i].duration || 300;
    if (acc + itemDur > posInCycle) { startIndex = i; seekOffset = posInCycle - acc; break; }
    acc += itemDur;
  }
  playMovie(startIndex);
  var seekTarget = seekOffset;
  var activeEl = getActiveMediaElement();
  if (activeEl && seekTarget > 0) {
    var onMeta = function() {
      activeEl.removeEventListener('loadedmetadata', onMeta);
      if (seekTarget > 0 && isFinite(activeEl.duration)) { activeEl.currentTime = Math.min(seekTarget, activeEl.duration - 1); }
    };
    if (isFinite(activeEl.duration) && activeEl.duration > 0) { activeEl.currentTime = Math.min(seekTarget, activeEl.duration - 1); }
    else { activeEl.addEventListener('loadedmetadata', onMeta); }
  }
}
function pingSyncTick() {
  if (!syncTick) syncTick = document.getElementById('sync-tick');
  if (!syncTick) return;
  syncTick.style.opacity = '1';
  if (syncTickTimer) clearTimeout(syncTickTimer);
  syncTickTimer = setTimeout(function(){ syncTick.style.opacity = '0'; }, 350);
}
if(playlist.length > 0) {
  renderGuideStrip();
  initMidnightAnchor();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(pingSyncTick, 5000);
} else {
  document.getElementById('now-playing').textContent = 'No videos in playlist';
}
</script>
